# Wdraża Workera panelu „Poprawki do portalu” (katalog worker/) na Cloudflare, gdy zmieni się jego kod, i na żądanie
# (Actions → Worker poprawek → Run workflow). Sekrety repozytorium (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  – dostęp do konta Cloudflare (wymagane),
#   ANTHROPIC_API_KEY, GH_TOKEN_POPRAWKI, KOD_DOSTEPU – trafiają do Workera jako jego sekrety
#   (GH_TOKEN_POPRAWKI jako GITHUB_TOKEN, bo GitHub nie pozwala nazwać sekretu GITHUB_…). Pusty sekret nie zmienia wartości w Workerze.
name: Worker poprawek

on:
  push:
    branches: [main]
    paths: ['worker/**', 'serwer/poprawki.json', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-poprawek
  cancel-in-progress: false

jobs:
  wdrozenie:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Czy jest konto Cloudflare
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Brak sekretów CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID, pomijam wdrożenie Workera."
            echo "jest=nie" >> "$GITHUB_OUTPUT"
          else
            echo "jest=tak" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cf.outputs.jest == 'tak'
      - uses: actions/setup-node@v4
        if: steps.cf.outputs.jest == 'tak'
        with:
          node-version: '22'
      - name: Wdróż Workera
        if: steps.cf.outputs.jest == 'tak'
        working-directory: worker
        run: npx --yes wrangler@4 deploy
      - name: Ustaw sekrety Workera
        if: steps.cf.outputs.jest == 'tak'
        working-directory: worker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN_POPRAWKI: ${{ secrets.GH_TOKEN_POPRAWKI }}
          KOD_DOSTEPU: ${{ secrets.KOD_DOSTEPU }}
        run: |
          ustaw() { if [ -n "$2" ]; then printf '%s' "$2" | npx --yes wrangler@4 secret put "$1"; else echo "::warning::Brak sekretu dla $1"; fi; }
          ustaw ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
          ustaw GITHUB_TOKEN "$GH_TOKEN_POPRAWKI"
          ustaw KOD_DOSTEPU "$KOD_DOSTEPU"
          echo "::notice::Worker wdrożony. Jego adres (https://mobywatel-poprawki.….workers.dev) jest w logu kroku „Wdróż Workera”."
